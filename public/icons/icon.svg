<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b2e" />
      <stop offset="1" stop-color="#0e0e16" />
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46e3ff" />
      <stop offset="1" stop-color="#7a5cff" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- beat bars -->
  <g fill="#46e3ff" opacity="0.35">
    <rect x="64" y="300" width="40" height="90" rx="8" />
    <rect x="128" y="250" width="40" height="140" rx="8" />
    <rect x="344" y="250" width="40" height="140" rx="8" />
    <rect x="408" y="300" width="40" height="90" rx="8" />
  </g>
  <!-- the cube -->
  <g transform="rotate(15 256 230)">
    <rect x="196" y="170" width="120" height="120" rx="20" fill="url(#cube)" />
    <rect x="226" y="200" width="60" height="60" rx="10" fill="#0e0e16" opacity="0.85" />
  </g>
</svg>
